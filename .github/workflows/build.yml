name: Version, Sign & Release Capacitor App

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG="v$APP_VERSION"
          
          VERSION_CODE=$(node -e "const [maj, min, pat] = '$APP_VERSION'.split('.').map(Number); console.log(maj * 10000 + min * 100 + pat);")
          
          echo "name=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "is_new=false" >> $GITHUB_OUTPUT
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node & Java
        if: steps.version.outputs.is_new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup JDK 21
        if: steps.version.outputs.is_new == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install & Build Web Assets
        if: steps.version.outputs.is_new == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Update Android Version Name & Code
        if: steps.version.outputs.is_new == 'true'
        uses: chkfung/android-version-actions@v1.2.1
        with:
          gradlePath: android/app/build.gradle
          versionCode: ${{ steps.version.outputs.code }}
          versionName: ${{ steps.version.outputs.name }}

      - name: Build Release APK & AAB
        if: steps.version.outputs.is_new == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign Release APK & AAB
        if: steps.version.outputs.is_new == 'true'
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f release.keystore' EXIT

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          LATEST_TOOLS=$(ls -1 "$SDK_DIR/build-tools" | sort -V | tail -n 1)
          if [ -z "$LATEST_TOOLS" ]; then
            echo "No Android build-tools found in $SDK_DIR/build-tools" >&2
            exit 1
          fi
          BUILD_TOOLS="$SDK_DIR/build-tools/$LATEST_TOOLS"

          # Align and sign the release APK
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/app-release-signed.apk"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # Sign the release AAB for Google Play
          UNSIGNED_AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" | head -n 1)
          if [ -z "$UNSIGNED_AAB" ]; then
            echo "No release AAB found" >&2
            exit 1
          fi
          SIGNED_AAB="android/app/build/outputs/bundle/release/app-release-signed.aab"
          cp "$UNSIGNED_AAB" "$SIGNED_AAB"

          jarsigner \
            -keystore release.keystore \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            "$SIGNED_AAB" \
            "$ANDROID_KEY_ALIAS"

          echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT
          echo "aab_path=$SIGNED_AAB" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Signed Binaries
        if: steps.version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.sign.outputs.apk_path }}" \
            "${{ steps.sign.outputs.aab_path }}" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --generate-notes